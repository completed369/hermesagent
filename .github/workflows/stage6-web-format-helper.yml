name: Temporary Stage 6 web formatter

'on':
  push:
    branches:
      - feat/stage6-opportunity-evidence-gates
    paths:
      - apps/web/src/app/dashboard/opportunities/[id]/page.tsx
      - apps/web/src/app/dashboard/opportunities/new/page.tsx
      - .github/workflows/stage6-web-format-helper.yml

permissions:
  contents: write

jobs:
  format-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/stage6-opportunity-evidence-gates
          persist-credentials: true
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write \
            'apps/web/src/app/dashboard/opportunities/[id]/page.tsx' \
            apps/web/src/app/dashboard/opportunities/new/page.tsx
          git diff --check
      - run: |
          set -Eeuo pipefail
          unexpected="$(git diff --name-only | grep -Ev '^apps/web/src/app/dashboard/opportunities/(\[id\]/page\.tsx|new/page\.tsx)$' || true)"
          test -z "$unexpected" || { printf 'Unexpected changes:\n%s\n' "$unexpected" >&2; exit 1; }
          git add \
            'apps/web/src/app/dashboard/opportunities/[id]/page.tsx' \
            apps/web/src/app/dashboard/opportunities/new/page.tsx
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(stage6): format opportunity web pages'
          git push origin HEAD:feat/stage6-opportunity-evidence-gates
