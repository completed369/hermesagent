# Read-only release-candidate evidence. This workflow builds and scans locally;
# it has no publication, deployment, registry, signing, or attestation capability.
name: Release candidate evidence (no publish)

'on':
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit currently at canonical main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ventureos-release-candidate-evidence-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  validate-source:
    name: Validate canonical main and scan source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Prove requested source is canonical main at dispatch and validation
        shell: bash
        env:
          API_URL: ${{ github.api_url }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$REPOSITORY" = completed369/hermesagent
          test "$DISPATCH_REF" = refs/heads/main
          [[ "$INPUT_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$INPUT_SOURCE_SHA" = "$DISPATCH_SHA"

          curl --fail --silent --show-error --location --retry 3 \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output /tmp/repository.json \
            "$API_URL/repos/$REPOSITORY"
          test "$(jq -er '.default_branch' /tmp/repository.json)" = main

          curl --fail --silent --show-error --location --retry 3 \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output /tmp/main-branch.json \
            "$API_URL/repos/$REPOSITORY/branches/main"
          test "$(jq -er '.name' /tmp/main-branch.json)" = main
          test "$(jq -er '.commit.sha' /tmp/main-branch.json)" = "$INPUT_SOURCE_SHA"
      - name: Checkout exact canonical source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify immutable checkout
        shell: bash
        env:
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$INPUT_SOURCE_SHA"
          test "$(git status --porcelain)" = ''
      - name: Record source secret and infrastructure scan evidence
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          format: json
          output: /tmp/ventureos-source.trivy.json
          exit-code: '0'
      - name: Gate source secrets and HIGH or CRITICAL infrastructure findings
        id: source-policy
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          trivy fs \
            --scanners secret,misconfig \
            --severity HIGH,CRITICAL \
            --format json \
            --output /tmp/source-policy.trivy.json \
            --exit-code 1 \
            .
      - name: Record sanitized source outcome
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_POLICY_OUTCOME: ${{ steps.source-policy.outcome }}
        run: |
          set -Eeuo pipefail
          {
            printf '### Source security evidence\n\n'
            printf -- '- Source SHA: `%s`\n' "$SOURCE_SHA"
            printf -- '- Policy outcome: `%s`\n' "$SOURCE_POLICY_OUTCOME"
            printf -- '- Retained artifact: `none`\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce source policy result
        if: always()
        env:
          SOURCE_POLICY_OUTCOME: ${{ steps.source-policy.outcome }}
        run: test "$SOURCE_POLICY_OUTCOME" = success

  build-scan:
    name: Build and scan ${{ matrix.image }} (local only)
    needs: validate-source
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            target: api
          - image: web
            target: web
          - image: worker
            target: worker
          - image: tools
            target: tools
          - image: ingress
            target: ingress
    steps:
      - name: Checkout exact canonical source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify immutable checkout
        shell: bash
        env:
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$INPUT_SOURCE_SHA"
      - name: Set up local Docker builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build exact linux/amd64 image into a runner-local archive
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ./Dockerfile.staging
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          provenance: false
          sbom: false
          no-cache: true
          tags: local/ventureos-${{ matrix.image }}:${{ inputs.source_sha }}
          outputs: type=docker,dest=/tmp/ventureos-${{ matrix.image }}.tar
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api-staging.ventureos.site
          labels: |
            org.opencontainers.image.source=https://github.com/completed369/hermesagent
            org.opencontainers.image.revision=${{ inputs.source_sha }}
      - name: Generate complete vulnerability JSON evidence
        id: vulnerability-evidence
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        with:
          input: /tmp/ventureos-${{ matrix.image }}.tar
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          format: json
          output: /tmp/ventureos-${{ matrix.image }}.trivy.json
          exit-code: '0'
      - name: Generate SPDX JSON SBOM
        id: sbom-evidence
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        with:
          input: /tmp/ventureos-${{ matrix.image }}.tar
          scanners: vuln
          format: spdx-json
          output: /tmp/ventureos-${{ matrix.image }}.spdx.json
          exit-code: '0'
      - name: Enforce fresh vulnerability database and CISA KEV policy
        id: kev-policy
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        run: |
          set -Eeuo pipefail
          trivy version --format json > "/tmp/${IMAGE_NAME}.trivy-version.json"
          updated="$(jq -er '.VulnerabilityDB.UpdatedAt' "/tmp/${IMAGE_NAME}.trivy-version.json")"
          updated_epoch="$(date --date="$updated" +%s)"
          now_epoch="$(date +%s)"
          age_seconds="$((now_epoch - updated_epoch))"
          test "$age_seconds" -ge -300
          test "$age_seconds" -le 86400

          curl --fail --silent --show-error --location --retry 3 \
            --output /tmp/known_exploited_vulnerabilities.json \
            https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
          jq -e '
            (.vulnerabilities | type == "array" and length > 0) and
            all(.vulnerabilities[]; (.cveID | type == "string" and test("^CVE-[0-9]{4}-[0-9]{4,}$")))
          ' \
            /tmp/known_exploited_vulnerabilities.json >/dev/null
          jq -r '.vulnerabilities[].cveID' \
            /tmp/known_exploited_vulnerabilities.json | sort -u > /tmp/kev.ids
          jq -r '[.Results[]?.Vulnerabilities[]?.VulnerabilityID] | unique[]' \
            "/tmp/ventureos-${IMAGE_NAME}.trivy.json" | sort -u > /tmp/findings.ids
          comm -12 /tmp/findings.ids /tmp/kev.ids > "/tmp/${IMAGE_NAME}.kev-matches.txt"
          if test -s "/tmp/${IMAGE_NAME}.kev-matches.txt"; then
            count="$(wc -l < "/tmp/${IMAGE_NAME}.kev-matches.txt" | tr -d ' ')"
            printf 'CISA Known Exploited Vulnerabilities fail the release-candidate gate: count=%s\n' "$count" >&2
            exit 1
          fi
      - name: Gate HIGH and CRITICAL vulnerabilities, secrets, config, and EOL bases
        id: image-policy
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        run: |
          set -Eeuo pipefail
          trivy image \
            --input "/tmp/ventureos-${IMAGE_NAME}.tar" \
            --scanners vuln,secret \
            --image-config-scanners secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed=false \
            --exit-on-eol 1 \
            --format json \
            --output "/tmp/${IMAGE_NAME}.policy.trivy.json" \
            --exit-code 1
      - name: Validate archive, vulnerability evidence, and SPDX identity
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -Eeuo pipefail
          archive="/tmp/ventureos-${IMAGE_NAME}.tar"
          report="/tmp/ventureos-${IMAGE_NAME}.trivy.json"
          sbom="/tmp/ventureos-${IMAGE_NAME}.spdx.json"
          manifest="/tmp/${IMAGE_NAME}.docker-manifest.json"
          config_file="/tmp/${IMAGE_NAME}.docker-config.json"

          if ! tar -xOf "$archive" manifest.json > "$manifest"; then
            echo 'Sanitized validation failure: docker-manifest-unreadable' >&2
            exit 1
          fi
          if ! jq -e 'length == 1 and (.[0].Config | type == "string" and length > 0)' \
            "$manifest" >/dev/null; then
            echo 'Sanitized validation failure: docker-manifest-shape' >&2
            exit 1
          fi
          config_path="$(jq -er '.[0].Config' "$manifest")"
          if [[ ! "$config_path" =~ ^[0-9a-f]{64}\.json$ ]]; then
            echo 'Sanitized validation failure: docker-config-identity' >&2
            exit 1
          fi
          if ! tar -xOf "$archive" "$config_path" > "$config_file"; then
            echo 'Sanitized validation failure: docker-config-unreadable' >&2
            exit 1
          fi
          if ! jq -e --arg source "$SOURCE_SHA" '
            .config.Labels["org.opencontainers.image.source"] == "https://github.com/completed369/hermesagent" and
            .config.Labels["org.opencontainers.image.revision"] == $source
          ' "$config_file" >/dev/null; then
            echo 'Sanitized validation failure: immutable-source-label' >&2
            exit 1
          fi
          config_digest="$(sha256sum "$config_file" | awk '{print $1}')"
          if [[ "$config_path" != "${config_digest}.json" ]]; then
            echo 'Sanitized validation failure: docker-config-digest' >&2
            exit 1
          fi
          expected_image_id="sha256:${config_digest}"
          if ! jq -e --arg archive "$archive" --arg image_id "$expected_image_id" \
            --slurpfile config "$config_file" '
            type == "object" and
            (.SchemaVersion | type == "integer") and
            .ArtifactName == $archive and
            .ArtifactType == "container_image" and
            (.Results | type == "array") and
            ($config | length == 1) and
            ($config[0].rootfs.diff_ids | type == "array" and length > 0) and
            all($config[0].rootfs.diff_ids[]; type == "string" and test("^sha256:[0-9a-f]{64}$")) and
            .Metadata.ImageID == $image_id and
            .Metadata.DiffIDs == $config[0].rootfs.diff_ids
          ' "$report" >/dev/null; then
            echo 'Sanitized validation failure: vulnerability-report-identity' >&2
            exit 1
          fi
          if ! jq -e '
            type == "object" and
            (.spdxVersion | type == "string" and startswith("SPDX-")) and
            .SPDXID == "SPDXRef-DOCUMENT" and
            (.documentNamespace | type == "string" and length > 0) and
            (.packages | type == "array" and length > 0)
          ' "$sbom" >/dev/null; then
            echo 'Sanitized validation failure: spdx-document-shape' >&2
            exit 1
          fi
      - name: Record exact evidence checksums
        if: success()
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -Eeuo pipefail
          printf '%s\n' "$SOURCE_SHA" > "/tmp/${IMAGE_NAME}.source-sha.txt"
          files=(
            "/tmp/ventureos-${IMAGE_NAME}.tar"
            "/tmp/ventureos-${IMAGE_NAME}.trivy.json"
            "/tmp/${IMAGE_NAME}.trivy-version.json"
            "/tmp/${IMAGE_NAME}.kev-matches.txt"
            /tmp/known_exploited_vulnerabilities.json
            "/tmp/ventureos-${IMAGE_NAME}.spdx.json"
            "/tmp/${IMAGE_NAME}.source-sha.txt"
          )
          for file in "${files[@]}"; do test -f "$file"; done
          sha256sum "${files[@]}" > "/tmp/${IMAGE_NAME}.sha256"
      - name: Record sanitized image outcome
        if: always()
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VULNERABILITY_OUTCOME: ${{ steps.vulnerability-evidence.outcome }}
          SBOM_OUTCOME: ${{ steps.sbom-evidence.outcome }}
          KEV_OUTCOME: ${{ steps.kev-policy.outcome }}
          IMAGE_POLICY_OUTCOME: ${{ steps.image-policy.outcome }}
        run: |
          set -Eeuo pipefail
          scanner_version=unavailable
          database_version=unavailable
          database_updated=unavailable
          vulnerability_total=unavailable
          critical_count=unavailable
          high_count=unavailable
          medium_count=unavailable
          low_count=unavailable
          unknown_count=unavailable
          sbom_packages=unavailable
          kev_matches=unavailable
          archive_checksum=unavailable
          report_checksum=unavailable
          sbom_checksum=unavailable

          if test -f "/tmp/${IMAGE_NAME}.trivy-version.json"; then
            scanner_version="$(jq -er '.Version' "/tmp/${IMAGE_NAME}.trivy-version.json")"
            database_version="$(jq -er '.VulnerabilityDB.Version' "/tmp/${IMAGE_NAME}.trivy-version.json")"
            database_updated="$(jq -er '.VulnerabilityDB.UpdatedAt' "/tmp/${IMAGE_NAME}.trivy-version.json")"
          fi
          if test -f "/tmp/ventureos-${IMAGE_NAME}.trivy.json"; then
            vulnerability_total="$(jq -er '[.Results[]?.Vulnerabilities[]?] | length' "/tmp/ventureos-${IMAGE_NAME}.trivy.json")"
            critical_count="$(jq -er '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' "/tmp/ventureos-${IMAGE_NAME}.trivy.json")"
            high_count="$(jq -er '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' "/tmp/ventureos-${IMAGE_NAME}.trivy.json")"
            medium_count="$(jq -er '[.Results[]?.Vulnerabilities[]? | select(.Severity == "MEDIUM")] | length' "/tmp/ventureos-${IMAGE_NAME}.trivy.json")"
            low_count="$(jq -er '[.Results[]?.Vulnerabilities[]? | select(.Severity == "LOW")] | length' "/tmp/ventureos-${IMAGE_NAME}.trivy.json")"
            unknown_count="$(jq -er '[.Results[]?.Vulnerabilities[]? | select((.Severity // "UNKNOWN") == "UNKNOWN")] | length' "/tmp/ventureos-${IMAGE_NAME}.trivy.json")"
            report_checksum="$(sha256sum "/tmp/ventureos-${IMAGE_NAME}.trivy.json" | awk '{print $1}')"
          fi
          if test -f "/tmp/ventureos-${IMAGE_NAME}.spdx.json"; then
            sbom_packages="$(jq -er '.packages | length' "/tmp/ventureos-${IMAGE_NAME}.spdx.json")"
            sbom_checksum="$(sha256sum "/tmp/ventureos-${IMAGE_NAME}.spdx.json" | awk '{print $1}')"
          fi
          if test -f "/tmp/${IMAGE_NAME}.kev-matches.txt"; then
            kev_matches="$(wc -l < "/tmp/${IMAGE_NAME}.kev-matches.txt" | tr -d ' ')"
          fi
          if test -f "/tmp/ventureos-${IMAGE_NAME}.tar"; then
            archive_checksum="$(sha256sum "/tmp/ventureos-${IMAGE_NAME}.tar" | awk '{print $1}')"
          fi

          {
            printf '### `%s` image evidence\n\n' "$IMAGE_NAME"
            printf -- '- Source SHA: `%s`\n' "$SOURCE_SHA"
            printf -- '- Vulnerability evidence: `%s`\n' "$VULNERABILITY_OUTCOME"
            printf -- '- SPDX generation: `%s`\n' "$SBOM_OUTCOME"
            printf -- '- KEV/freshness policy: `%s`\n' "$KEV_OUTCOME"
            printf -- '- Vulnerability/secret/EOL policy: `%s`\n' "$IMAGE_POLICY_OUTCOME"
            printf -- '- Scanner version: `%s`\n' "$scanner_version"
            printf -- '- Vulnerability DB schema/update: `%s` / `%s`\n' "$database_version" "$database_updated"
            printf -- '- Sanitized vulnerability counts — total: `%s`; critical: `%s`; high: `%s`; medium: `%s`; low: `%s`; unknown: `%s`\n' "$vulnerability_total" "$critical_count" "$high_count" "$medium_count" "$low_count" "$unknown_count"
            printf -- '- Sanitized evidence counts — SPDX packages: `%s`; KEV matches: `%s`\n' "$sbom_packages" "$kev_matches"
            printf -- '- Local checksums — archive: `%s`; vulnerability report: `%s`; SPDX: `%s`\n' "$archive_checksum" "$report_checksum" "$sbom_checksum"
            printf -- '- Retained artifact: `none`\n'
          } >> "$GITHUB_STEP_SUMMARY"

  revalidate-source:
    name: Revalidate canonical main after all evidence
    needs: build-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Prove scanned source is still canonical main
        shell: bash
        env:
          API_URL: ${{ github.api_url }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$REPOSITORY" = completed369/hermesagent
          test "$DISPATCH_REF" = refs/heads/main
          [[ "$INPUT_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$INPUT_SOURCE_SHA" = "$DISPATCH_SHA"
          curl --fail --silent --show-error --location --retry 3 \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output /tmp/main-branch.json \
            "$API_URL/repos/$REPOSITORY/branches/main"
          test "$(jq -er '.name' /tmp/main-branch.json)" = main
          test "$(jq -er '.commit.sha' /tmp/main-branch.json)" = "$INPUT_SOURCE_SHA"
