name: Temporary Stage 6 compliance formatter

'on':
  push:
    branches:
      - feat/stage6-gate1-compliance
    paths:
      - packages/policy-engine/src/opportunity-compliance.ts
      - .github/workflows/stage6-compliance-format-helper.yml

permissions:
  contents: write

jobs:
  format-compliance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/stage6-gate1-compliance
          persist-credentials: true
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          set -Eeuo pipefail
          pnpm exec prettier --write packages/policy-engine/src/opportunity-compliance.ts
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^packages/policy-engine/src/opportunity-compliance.ts$' || true)"
          test -z "$unexpected" || { printf 'Unexpected changes:\n%s\n' "$unexpected" >&2; exit 1; }
      - run: |
          set -Eeuo pipefail
          git add packages/policy-engine/src/opportunity-compliance.ts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(stage6): format compliance policy'
          git push origin HEAD:feat/stage6-gate1-compliance
