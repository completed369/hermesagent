name: Temporary lockfile refresh

'on':
  pull_request:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/lockfile-refresh.yml

permissions:
  contents: read

jobs:
  refresh-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Enable Corepack
        run: corepack enable
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Regenerate lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Verify Nano ID resolution
        run: |
          set -Eeuo pipefail
          grep -q '^  nanoid: 3.3.18$' pnpm-lock.yaml
          grep -q '^  nanoid@3.3.18:$' pnpm-lock.yaml
          ! grep -q '^  nanoid@3.3.17:$' pnpm-lock.yaml
      - name: Upload generated lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nanoid-3.3.18-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
