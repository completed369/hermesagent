          anchor = """- Memory is advisory context only. It cannot grant, revoke or substitute for approval authority, policy checks, current business state or commercial evidence.\n"""
          if text.count(anchor) != 1:
              raise SystemExit('COMMERCIAL_VALIDATION.md: execution-rule anchor mismatch')
          addition = anchor + """\n### Commercial observation provenance\n\nExperiment results used for genuine Gate 5/6 evidence must be explicitly recorded as `REAL` with a non-synthetic source type, source reference and observation timestamp. Unspecified and historical experiment results default to `MOCK`/`SYNTHETIC`; they may prove workflow mechanics but cannot satisfy genuine commercial-validation or scale-evidence claims. Provenance is persisted separately from the numeric result and is included in the scale-approval artifact hash, so changing the evidence set invalidates an older scale authorization. Gate 5 support load has explicit `SUPPORT_CONTACTS`, `SUPPORT_MINUTES` and `QUALITY_INCIDENTS` metric names rather than being hidden under `OTHER`.\n"""
          validation_doc.write_text(text.replace(anchor, addition, 1))

          pilot_log = Path('docs/COMMERCIAL_PILOT_LOG.md')
          text = pilot_log.read_text()
          anchor = """- Evidence source: TBD (`REAL` or `MOCK/MECHANICAL`)\n- Marketplace/account: TBD\n- Measurement window: TBD\n"""
          replacement = """- Evidence source: TBD (`REAL` or `MOCK/MECHANICAL`)\n- ExperimentResult IDs: TBD\n- Provenance source references: TBD\n- All counted commercial results have `evidenceMode=REAL`: TBD\n- Marketplace/account: TBD\n- Measurement window: TBD\n"""
          if text.count(anchor) != 1:
              raise SystemExit('COMMERCIAL_PILOT_LOG.md: Gate 5 evidence anchor mismatch')
          pilot_log.write_text(text.replace(anchor, replacement, 1))

          expected = {
            'apps/api/src/modules/finance/finance.dto.ts',
            'apps/api/src/modules/finance/finance.dto.spec.ts',
            'apps/api/src/modules/finance/finance.service.ts',
            'apps/api/test/stage6-commercial-observation.integration.spec.ts',
            'packages/finance-engine/src/commercial-observation-provenance.ts',
            'packages/finance-engine/src/experiment-runner.ts',
            'packages/finance-engine/src/index.ts',
            'packages/database/prisma/migrations/20260815123000_commercial_observation_provenance/migration.sql',
            'docs/COMMERCIAL_VALIDATION.md',
            'docs/COMMERCIAL_PILOT_LOG.md',
            '.github/workflows/stage6-observation-helper.yml',
          }
          import subprocess
          changed = set(subprocess.check_output(['git', 'status', '--short'], text=True).splitlines())
          changed_paths = {line[3:] for line in changed}
          unexpected = changed_paths - expected
          if unexpected:
              raise SystemExit(f'unexpected changed paths: {sorted(unexpected)}')
          PY
      - name: Format and validate patch
        run: |
          set -Eeuo pipefail
          pnpm exec prettier --write \
            apps/api/src/modules/finance/finance.dto.ts \
            apps/api/src/modules/finance/finance.dto.spec.ts \
            apps/api/src/modules/finance/finance.service.ts \
            apps/api/test/stage6-commercial-observation.integration.spec.ts \
            packages/finance-engine/src/commercial-observation-provenance.ts \
            packages/finance-engine/src/experiment-runner.ts \
            packages/finance-engine/src/index.ts \
            docs/COMMERCIAL_VALIDATION.md \
            docs/COMMERCIAL_PILOT_LOG.md
          git diff --check
          pnpm --filter @ventureos/database exec prisma validate --schema prisma/schema.prisma
          pnpm --filter @ventureos/finance-engine typecheck
          pnpm --filter @ventureos/api typecheck
          pnpm --filter @ventureos/api exec vitest run src/modules/finance/finance.dto.spec.ts
      - name: Commit patch
        run: |
          set -Eeuo pipefail
          git add \
            apps/api/src/modules/finance/finance.dto.ts \
            apps/api/src/modules/finance/finance.dto.spec.ts \
            apps/api/src/modules/finance/finance.service.ts \
            apps/api/test/stage6-commercial-observation.integration.spec.ts \
            packages/finance-engine/src/commercial-observation-provenance.ts \
            packages/finance-engine/src/experiment-runner.ts \
            packages/finance-engine/src/index.ts \
            packages/database/prisma/migrations/20260815123000_commercial_observation_provenance/migration.sql \
            docs/COMMERCIAL_VALIDATION.md \
            docs/COMMERCIAL_PILOT_LOG.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(stage6): govern commercial observation provenance'
          git push origin HEAD:feat/stage6-commercial-observation-provenance
