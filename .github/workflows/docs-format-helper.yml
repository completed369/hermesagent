name: Temporary Stage 6 commercial evidence UI helper

'on':
  push:
    branches:
      - feat/stage6-commercial-observation-provenance
    paths:
      - .github/workflows/docs-format-helper.yml

permissions:
  contents: write

jobs:
  apply-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ventureos:ci-only-password@localhost:5432/ventureos?schema=public
    steps:
      - name: Checkout isolated feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/stage6-commercial-observation-provenance
          persist-credentials: true
      - name: Enable Corepack
        run: corepack enable
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Apply guarded UI patch
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          actions = 'apps/web/src/components/experiment-actions.tsx'
          replace_once(actions,
          """          metrics: [
            { name: 'REVENUE_EUR', unit: 'EUR' },
            { name: 'CONVERSION_RATE', unit: '%' },
          ],""",
          """          metrics: [
            { name: 'REVENUE_EUR', unit: 'EUR' },
            { name: 'CONVERSION_RATE', unit: '%' },
            { name: 'SUPPORT_CONTACTS', unit: 'count' },
            { name: 'SUPPORT_MINUTES', unit: 'minutes' },
            { name: 'QUALITY_INCIDENTS', unit: 'count' },
          ],""")
          replace_once(actions,
          """interface Metric {
  id: string;
  name: string;
}

export function ExperimentPanelActions({""",
          """interface Metric {
  id: string;
  name: string;
}

type EvidenceMode = 'MOCK' | 'REAL';
type ObservationSourceType =
  | 'MARKETPLACE_EXPORT'
  | 'CUSTOMER_SUPPORT'
  | 'FOUNDER_OBSERVED'
  | 'MANUAL_IMPORT'
  | 'SYNTHETIC';

export function ExperimentPanelActions({""")
          replace_once(actions,
          """  const [value, setValue] = useState('');
  const [decision, setDecision] = useState<'SCALE' | 'KILL' | 'ITERATE' | 'HOLD'>('ITERATE');""",
          """  const [value, setValue] = useState('');
  const [evidenceMode, setEvidenceMode] = useState<EvidenceMode>('MOCK');
  const [sourceType, setSourceType] = useState<ObservationSourceType>('SYNTHETIC');
  const [sourceRef, setSourceRef] = useState('');
  const [observedAt, setObservedAt] = useState('');
  const [decision, setDecision] = useState<'SCALE' | 'KILL' | 'ITERATE' | 'HOLD'>('ITERATE');""")
          old_block = """          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' }}>
            <select value={variantId} onChange={(e) => setVariantId(e.target.value)}>
              {variants.map((v) => (
                <option key={v.id} value={v.id}>
                  {v.name}
                </option>
              ))}
            </select>
            <select value={metricId} onChange={(e) => setMetricId(e.target.value)}>
              {metrics.map((m) => (
                <option key={m.id} value={m.id}>
                  {m.name}
                </option>
              ))}
            </select>
            <input
              type="number"
              step="0.0001"
              placeholder="Value"
              value={value}
              onChange={(e) => setValue(e.target.value)}
              style={{ width: 100 }}
            />
            <button
              type="button"
              className="vos-btn"
              disabled={loading || !value}
              onClick={() =>
                run(() =>
                  apiFetch(`/finance/experiments/${experimentId}/results`, {
                    method: 'POST',
                    body: JSON.stringify({
                      experimentVariantId: variantId,
                      experimentMetricId: metricId,
                      value: Number(value),
                    }),
                  }).then(() => setValue('')),
                )
              }
            >
              Record result
            </button>
          </div>
"""
          new_block = """          <div style={{ display: 'grid', gap: 8 }}>
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' }}>
              <select
                data-testid="experiment-result-variant"
                value={variantId}
                onChange={(e) => setVariantId(e.target.value)}
              >
                {variants.map((v) => (
                  <option key={v.id} value={v.id}>
                    {v.name}
                  </option>
                ))}
              </select>
              <select
                data-testid="experiment-result-metric"
                value={metricId}
                onChange={(e) => setMetricId(e.target.value)}
              >
                {metrics.map((m) => (
                  <option key={m.id} value={m.id}>
                    {m.name}
                  </option>
                ))}
              </select>
              <input
                data-testid="experiment-result-value"
                type="number"
                step="0.0001"
                placeholder="Value"
                value={value}
                onChange={(e) => setValue(e.target.value)}
                style={{ width: 100 }}
              />
              <select
                data-testid="experiment-evidence-mode"
                value={evidenceMode}
                onChange={(e) => {
                  const next = e.target.value as EvidenceMode;
                  setEvidenceMode(next);
                  if (next === 'MOCK') {
                    setSourceType('SYNTHETIC');
                    setSourceRef('');
                    setObservedAt('');
                  } else if (sourceType === 'SYNTHETIC') {
                    setSourceType('FOUNDER_OBSERVED');
                  }
                }}
              >
                <option value="MOCK">MOCK / mechanical</option>
                <option value="REAL">REAL commercial evidence</option>
              </select>
            </div>

            {evidenceMode === 'REAL' ? (
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' }}>
                <select
                  data-testid="experiment-source-type"
                  value={sourceType}
                  onChange={(e) => setSourceType(e.target.value as ObservationSourceType)}
                >
                  <option value="MARKETPLACE_EXPORT">Marketplace export</option>
                  <option value="CUSTOMER_SUPPORT">Customer support</option>
                  <option value="FOUNDER_OBSERVED">Founder observed</option>
                  <option value="MANUAL_IMPORT">Manual import</option>
                </select>
                <input
                  data-testid="experiment-source-ref"
                  type="text"
                  placeholder="Evidence/source reference"
                  value={sourceRef}
                  onChange={(e) => setSourceRef(e.target.value)}
                  style={{ width: 240 }}
                />
                <input
                  data-testid="experiment-observed-at"
                  type="datetime-local"
                  aria-label="Observed at"
                  value={observedAt}
                  onChange={(e) => setObservedAt(e.target.value)}
                />
              </div>
            ) : (
              <p style={{ margin: 0, fontSize: 12, color: 'var(--vos-text-muted)' }}>
                MOCK results prove workflow mechanics only and cannot satisfy genuine Gate 5/6
                commercial evidence.
              </p>
            )}

            <button
              data-testid="experiment-record-result"
              type="button"
              className="vos-btn"
              disabled={
                loading ||
                !value ||
                (evidenceMode === 'REAL' && (!sourceRef.trim() || !observedAt))
              }
              onClick={() =>
                run(() =>
                  apiFetch(`/finance/experiments/${experimentId}/results`, {
                    method: 'POST',
                    body: JSON.stringify({
                      experimentVariantId: variantId,
                      experimentMetricId: metricId,
                      value: Number(value),
                      evidenceMode,
                      sourceType,
                      sourceRef: evidenceMode === 'REAL' ? sourceRef.trim() : undefined,
                      observedAt:
                        evidenceMode === 'REAL' ? new Date(observedAt).toISOString() : undefined,
                    }),
                  }).then(() => {
                    setValue('');
                    if (evidenceMode === 'REAL') {
                      setSourceRef('');
                      setObservedAt('');
                    }
                  }),
                )
              }
              style={{ width: 'fit-content' }}
            >
              Record result
            </button>
          </div>
"""
          replace_once(actions, old_block, new_block)

          page_path = 'apps/web/src/app/dashboard/finance/[ventureProposalId]/page.tsx'
          replace_once(page_path,
          """interface ExperimentResultRow {
  id: string;
  experimentVariantId: string;
  experimentMetricId: string;
  value: string;
  measuredAt: string;
}""",
          """interface ExperimentResultRow {
  id: string;
  experimentVariantId: string;
  experimentMetricId: string;
  value: string;
  measuredAt: string;
  provenance: {
    evidenceMode: 'REAL' | 'MOCK';
    sourceType: string;
    sourceRef: string | null;
    observedAt: string;
  } | null;
}""")
          replace_once(page_path,
          """                      <th>Value</th>
                      <th>Measured</th>""",
          """                      <th>Value</th>
                      <th>Evidence</th>
                      <th>Source</th>
                      <th>Measured</th>""")
          replace_once(page_path,
          """                          <td>{r.value}</td>
                          <td>{new Date(r.measuredAt).toLocaleString()}</td>""",
          """                          <td>{r.value}</td>
                          <td>
                            <span
                              data-testid={`experiment-result-evidence-${r.id}`}
                              className={`vos-badge ${
                                r.provenance?.evidenceMode === 'REAL'
                                  ? 'vos-badge--ok'
                                  : 'vos-badge--mock'
                              }`}
                            >
                              {r.provenance?.evidenceMode ?? 'MOCK'}
                            </span>
                          </td>
                          <td data-testid={`experiment-result-source-${r.id}`}>
                            {r.provenance
                              ? `${r.provenance.sourceType}${
                                  r.provenance.sourceRef ? ` · ${r.provenance.sourceRef}` : ''
                                }`
                              : 'Legacy / unprovenanced'}
                          </td>
                          <td>{new Date(r.measuredAt).toLocaleString()}</td>""")

          e2e = 'apps/web/e2e/stage6-opportunity-intake.spec.ts'
          replace_once(e2e,
          """    await expect(page.getByTestId('compliance-blockers')).toHaveCount(0);
  });
});
""",
          """    await expect(page.getByTestId('compliance-blockers')).toHaveCount(0);

    const [promoteResponse] = await Promise.all([
      page.waitForResponse(
        (candidate) =>
          candidate.request().method() === 'POST' &&
          candidate.url().includes('/api/opportunities/') &&
          candidate.url().endsWith('/promote'),
      ),
      page.getByRole('button', { name: 'Promote to Venture Proposal' }).click(),
    ]);
    expect(promoteResponse.status()).toBe(201);
    const promoted = (await promoteResponse.json()) as { proposal: { id: string } };

    await page.goto(`/dashboard/finance/${promoted.proposal.id}`);
    await expect(page.getByRole('heading', { name: 'Finance' })).toBeVisible();
    await page.getByPlaceholder('Experiment name').fill(`Stage 6 commercial evidence ${unique}`);
    await page
      .getByPlaceholder('Hypothesis')
      .fill('Observed support load remains manageable during the pilot.');
    const [experimentResponse] = await Promise.all([
      page.waitForResponse(
        (candidate) =>
          candidate.request().method() === 'POST' &&
          candidate.url().endsWith(`/api/finance/ventures/${promoted.proposal.id}/experiments`),
      ),
      page.getByRole('button', { name: 'Create experiment (Control vs. Variant B)' }).click(),
    ]);
    expect(experimentResponse.status()).toBe(201);
    await expect(page.getByText('SUPPORT_MINUTES')).toBeVisible();

    await page.getByRole('button', { name: 'Start experiment' }).click();
    await page.getByTestId('experiment-result-metric').selectOption({ label: 'SUPPORT_MINUTES' });
    await page.getByTestId('experiment-result-value').fill('12');
    await page.getByTestId('experiment-evidence-mode').selectOption('REAL');
    await page.getByTestId('experiment-source-type').selectOption('CUSTOMER_SUPPORT');
    await page
      .getByTestId('experiment-source-ref')
      .fill(`support-log:e2e-${unique}`);
    await page.getByTestId('experiment-observed-at').fill(retrievedAt);

    const [resultResponse] = await Promise.all([
      page.waitForResponse(
        (candidate) =>
          candidate.request().method() === 'POST' &&
          candidate.url().includes('/api/finance/experiments/') &&
          candidate.url().endsWith('/results'),
      ),
      page.getByTestId('experiment-record-result').click(),
    ]);
    expect(resultResponse.status()).toBe(201);
    await expect(page.getByText('REAL', { exact: true })).toBeVisible();
    await expect(page.getByText(`CUSTOMER_SUPPORT · support-log:e2e-${unique}`)).toBeVisible();
  });
});
""")
          PY
      - name: Format and validate UI
        run: |
          set -Eeuo pipefail
          pnpm exec prettier --write \
            apps/web/src/components/experiment-actions.tsx \
            'apps/web/src/app/dashboard/finance/[ventureProposalId]/page.tsx' \
            apps/web/e2e/stage6-opportunity-intake.spec.ts
          git diff --check
          pnpm db:generate
          pnpm run typecheck
      - name: Commit UI patch
        run: |
          set -Eeuo pipefail
          git add \
            apps/web/src/components/experiment-actions.tsx \
            'apps/web/src/app/dashboard/finance/[ventureProposalId]/page.tsx' \
            apps/web/e2e/stage6-opportunity-intake.spec.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(stage6): expose commercial evidence provenance in finance UI'
          git push origin HEAD:feat/stage6-commercial-observation-provenance
