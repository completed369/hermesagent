name: Temporary commercial evidence UI formatter

'on':
  push:
    branches:
      - feat/stage6-commercial-observation-provenance
    paths:
      - .github/workflows/docs-format-helper.yml

permissions:
  contents: write

jobs:
  format-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout isolated feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/stage6-commercial-observation-provenance
          persist-credentials: true
      - name: Enable Corepack
        run: corepack enable
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Format one UI file
        run: |
          set -Eeuo pipefail
          pnpm exec prettier --write apps/web/src/components/experiment-actions.tsx
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^apps/web/src/components/experiment-actions.tsx$' || true)"
          test -z "$unexpected" || { printf 'Unexpected changes:\n%s\n' "$unexpected" >&2; exit 1; }
      - name: Commit formatter output
        run: |
          set -Eeuo pipefail
          git add apps/web/src/components/experiment-actions.tsx
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(stage6): format commercial evidence UI'
          git push origin HEAD:feat/stage6-commercial-observation-provenance
