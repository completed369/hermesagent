name: Temporary Stage 6 provenance repair helper

'on':
  push:
    branches:
      - feat/stage6-commercial-observation-provenance
    paths:
      - .github/workflows/docs-format-helper.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout isolated feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/stage6-commercial-observation-provenance
          persist-credentials: true
      - name: Enable Corepack
        run: corepack enable
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Apply guarded repair
        run: python3 scripts/stage6-provenance-repair.py
      - name: Format repaired files
        run: |
          pnpm exec prettier --write packages/finance-engine/src/commercial-observation-provenance.ts packages/finance-engine/src/experiment-runner.ts packages/finance-engine/src/__tests__/capability-policy.test.ts
          git diff --check
      - name: Validate repaired finance boundary
        run: |
          pnpm db:generate
          pnpm run typecheck
          pnpm --filter @ventureos/finance-engine test:unit
      - name: Commit repair
        run: |
          git add packages/finance-engine/src/commercial-observation-provenance.ts packages/finance-engine/src/experiment-runner.ts packages/finance-engine/src/__tests__/capability-policy.test.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(stage6): preserve finance capability ordering with provenance'
          git push origin HEAD:feat/stage6-commercial-observation-provenance
