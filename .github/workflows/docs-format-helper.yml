name: Temporary docs format helper

'on':
  pull_request:
    branches: [main]
    paths:
      - docs/COMMERCIAL_PILOT_LOG.md
      - docs/COMMERCIAL_VALIDATION.md
      - docs/STAGING_QA_LOG.md
      - .github/workflows/docs-format-helper.yml

permissions:
  contents: write

jobs:
  format-docs:
    if: ${{ github.event.pull_request.head.ref == 'docs/stage5-stage6-prep' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout isolated docs branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: docs/stage5-stage6-prep
          persist-credentials: true
      - name: Enable Corepack
        run: corepack enable
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Format only Stage 5/6 docs
        run: |
          set -Eeuo pipefail
          pnpm exec prettier --write \
            docs/COMMERCIAL_PILOT_LOG.md \
            docs/COMMERCIAL_VALIDATION.md \
            docs/STAGING_QA_LOG.md
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^(docs/COMMERCIAL_PILOT_LOG.md|docs/COMMERCIAL_VALIDATION.md|docs/STAGING_QA_LOG.md)$' || true)"
          test -z "$unexpected" || { printf 'Unexpected changes:\n%s\n' "$unexpected" >&2; exit 1; }
      - name: Commit formatter output
        run: |
          set -Eeuo pipefail
          git add docs/COMMERCIAL_PILOT_LOG.md docs/COMMERCIAL_VALIDATION.md docs/STAGING_QA_LOG.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: apply repository formatting'
          git push origin HEAD:docs/stage5-stage6-prep
