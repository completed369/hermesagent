name: Temporary docs format helper

'on':
  push:
    branches:
      - docs/stage6-readiness-reconcile
    paths:
      - docs/COMMERCIAL_VALIDATION.md
      - .github/workflows/docs-format-helper.yml

permissions:
  contents: write

jobs:
  format-doc:
    if: ${{ github.ref == 'refs/heads/docs/stage6-readiness-reconcile' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout isolated docs branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: docs/stage6-readiness-reconcile
          persist-credentials: true
      - name: Enable Corepack
        run: corepack enable
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Format validation doc only
        run: |
          set -Eeuo pipefail
          pnpm exec prettier --write docs/COMMERCIAL_VALIDATION.md
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^docs/COMMERCIAL_VALIDATION.md$' || true)"
          test -z "$unexpected" || { printf 'Unexpected changes:\n%s\n' "$unexpected" >&2; exit 1; }
      - name: Commit formatter output
        run: |
          set -Eeuo pipefail
          git add docs/COMMERCIAL_VALIDATION.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: apply repository formatting'
          git push origin HEAD:docs/stage6-readiness-reconcile
