name: Prisma Rust-free lockfile evidence

'on':
  pull_request:
    branches: [main]
    paths:
      - 'packages/database/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/prisma-rust-free-lockfile.yml'

permissions:
  contents: read

jobs:
  generate-lockfile:
    name: Generate remediation lockfile artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout remediation PR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Regenerate lockfile only
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm install --lockfile-only
          git diff --check -- pnpm-lock.yaml
          test -s pnpm-lock.yaml

      - name: Preserve generated lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prisma-rust-free-lockfile-${{ github.event.pull_request.head.sha }}
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 7
