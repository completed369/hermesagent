name: Prisma Rust-free lockfile evidence

'on':
  pull_request:
    branches: [main]
    paths:
      - 'packages/database/package.json'
      - 'packages/database/prisma/schema.prisma'
      - 'pnpm-lock.yaml'
      - '.github/workflows/prisma-rust-free-lockfile.yml'

permissions:
  contents: write

jobs:
  generate-lockfile:
    name: Materialize remediation inputs
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/prisma-rust-free-runtime
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Rust-free Prisma client generator
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          schema = Path('packages/database/prisma/schema.prisma')
          text = schema.read_text()
          old = 'generator client {\n  provider = "prisma-client-js"\n}'
          new = 'generator client {\n  provider   = "prisma-client-js"\n  engineType = "client"\n}'
          if new not in text:
              if old not in text:
                  raise SystemExit('unexpected Prisma generator block')
              text = text.replace(old, new, 1)
              schema.write_text(text)
          PY

      - name: Regenerate and validate Prisma inputs
        shell: bash
        env:
          DATABASE_URL: postgresql://ventureos:ci-only-password@127.0.0.1:5432/ventureos?schema=public
        run: |
          set -Eeuo pipefail
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm --filter @ventureos/database exec prisma format --check --schema prisma/schema.prisma
          pnpm --filter @ventureos/database exec prisma validate --schema prisma/schema.prisma
          git diff --check -- packages/database/prisma/schema.prisma pnpm-lock.yaml

      - name: Commit generated remediation inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/database/prisma/schema.prisma pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Generated remediation inputs already current.'
            exit 0
          fi
          git commit -m 'fix(database): enable Rust-free Prisma runtime inputs'
          git push origin HEAD:fix/prisma-rust-free-runtime
