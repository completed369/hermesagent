name: Memory Format Preview

on:
  pull_request:
    paths:
      - '.github/workflows/memory-format-preview.yml'
      - 'packages/agent-runtime/src/memory.ts'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Print Prettier diff
        run: |
          pnpm exec prettier --write packages/agent-runtime/src/memory.ts
          git diff -- packages/agent-runtime/src/memory.ts
