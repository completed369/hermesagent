name: Runtime substrate remediation evidence

'on':
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'Dockerfile.staging'
      - 'package.json'
      - 'packages/database/package.json'
      - 'packages/agent-bridge/**'
      - 'pnpm-lock.yaml'
      - 'scripts/runtime-secret-entrypoint.mjs'
      - 'scripts/staging-build-contract.test.mjs'
      - '.github/candidates/Dockerfile.nossl-libgcc'
      - '.github/workflows/runtime-substrate-remediation.yml'

permissions:
  contents: read

jobs:
  nossl-libgcc:
    name: Gate base-nossl plus provenanced C/C++ runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout remediation PR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned Trivy action implementation
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514

      - name: Build no-ssl libgcc candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build \
            --file .github/candidates/Dockerfile.nossl-libgcc \
            --tag "local/ventureos-nossl-libgcc:${GITHUB_SHA}" \
            .

      - name: Verify library and Debian package provenance are present
        shell: bash
        run: |
          set -Eeuo pipefail
          image="local/ventureos-nossl-libgcc:${GITHUB_SHA}"
          cid="$(docker create "$image" /nonexistent-inspection-command)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/usr/lib/x86_64-linux-gnu/libgcc_s.so.1" /tmp/libgcc_s.so.1
          docker cp "$cid:/usr/lib/x86_64-linux-gnu/libstdc++.so.6" /tmp/libstdc++.so.6
          docker cp "$cid:/var/lib/dpkg/status.d/libgcc-s1" /tmp/libgcc-s1.status
          docker cp "$cid:/var/lib/dpkg/status.d/libstdc++6" /tmp/libstdc++6.status
          test -s /tmp/libgcc_s.so.1
          test -s /tmp/libstdc++.so.6
          test -s /tmp/libgcc-s1.status
          test -s /tmp/libstdc++6.status
          grep -q '^Package: libgcc-s1$' /tmp/libgcc-s1.status
          grep -q '^Package: libstdc++6$' /tmp/libstdc++6.status

      - name: Generate complete vulnerability evidence
        shell: bash
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        run: |
          set -Eeuo pipefail
          trivy image \
            "local/ventureos-nossl-libgcc:${GITHUB_SHA}" \
            --scanners vuln \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --ignore-unfixed=false \
            --format json \
            --output /tmp/nossl-libgcc.trivy.json \
            --exit-code 0
          jq -e '[.Results[]?.Packages[]? | select(.Name == "libgcc-s1")] | length > 0' /tmp/nossl-libgcc.trivy.json >/dev/null
          jq -e '[.Results[]?.Packages[]? | select(.Name == "libstdc++6")] | length > 0' /tmp/nossl-libgcc.trivy.json >/dev/null
          if jq -e '[.Results[]?.Packages[]? | select(.Name == "libssl3t64")] | length > 0' /tmp/nossl-libgcc.trivy.json >/dev/null; then
            echo 'Unexpected libssl3t64 package in no-ssl candidate.' >&2
            exit 1
          fi

      - name: Apply unchanged release-equivalent security gate
        shell: bash
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        run: |
          set -Eeuo pipefail
          trivy image \
            "local/ventureos-nossl-libgcc:${GITHUB_SHA}" \
            --scanners vuln,secret \
            --image-config-scanners secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed=false \
            --exit-on-eol 1 \
            --exit-code 1

      - name: Preserve substrate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nossl-libgcc-runtime-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/libgcc-s1.status
            /tmp/libstdc++6.status
            /tmp/nossl-libgcc.trivy.json
          if-no-files-found: warn
          retention-days: 30

  final-images:
    name: Build and scan final ${{ matrix.image }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: [api, web, worker, tools, ingress]
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build exact linux/amd64 image without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile.staging
          target: ${{ matrix.image }}
          platforms: linux/amd64
          push: false
          no-cache: true
          tags: local/ventureos-${{ matrix.image }}:${{ github.event.pull_request.head.sha }}
          outputs: type=docker,dest=/tmp/ventureos-${{ matrix.image }}.tar
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api-staging.ventureos.site
          labels: |
            org.opencontainers.image.source=https://github.com/completed369/hermesagent
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
      - name: Verify test signing material and fixtures are absent from final image
        env:
          IMAGE_NAME: ${{ matrix.image }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          docker load --input "/tmp/ventureos-${IMAGE_NAME}.tar"
          image="local/ventureos-${IMAGE_NAME}:${SOURCE_SHA}"
          cid="$(docker create "$image")"
          rootfs="$(mktemp -d)"
          runtime_file_manifest="$(mktemp)"
          cleanup() {
            docker rm -f "$cid" >/dev/null 2>&1 || true
            rm -rf -- "$rootfs"
            rm -f -- "$runtime_file_manifest"
          }
          trap cleanup EXIT
          docker export "$cid" | tar -xf - -C "$rootfs"
          find "$rootfs" -mindepth 1 -printf '%y\0%P\0%l\0' | node scripts/verify-agent-bridge-runtime-root.mjs
          find "$rootfs" -type f -print0 > "$runtime_file_manifest"
          while IFS= read -r -d '' runtime_file; do
            if grep -aEq 'NATIVE_SUPERVISOR_DENIED:|AUTHENTICATED_TRANSCRIPT|authenticated-lifecycle-addon' "$runtime_file"; then
              echo 'Native supervisor test helper entered a final runtime image.' >&2
              exit 1
            else
              native_fixture_status=$?
              if test "$native_fixture_status" -ne 1; then
                echo 'Final runtime image native-fixture scan failed.' >&2
                exit 1
              fi
            fi
            if grep -aFq \
              'MC4CAQAwBQYDK2VwBCIEIDXgLTsIlYz/jfY7Or5Ylt4TinBgk8MUM5C+13sON7Uo' \
              "$runtime_file"; then
              echo 'Test signing material entered a final runtime image.' >&2
              exit 1
            else
              fingerprint_status=$?
              if test "$fingerprint_status" -ne 1; then
                echo 'Final runtime image signing-material scan failed.' >&2
                exit 1
              fi
            fi
          done < "$runtime_file_manifest"
      - name: Generate complete vulnerability evidence
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/ventureos-${{ matrix.image }}.tar
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          format: json
          output: /tmp/ventureos-${{ matrix.image }}.trivy.json
          exit-code: '0'
      - name: Verify repaired runtime composition
        env:
          IMAGE_NAME: ${{ matrix.image }}
        shell: bash
        run: |
          set -Eeuo pipefail
          report="/tmp/ventureos-${IMAGE_NAME}.trivy.json"
          test "$(jq '[.Results[]?.Packages[]? | select(.Name == "libgcc-s1")] | length' "$report")" -gt 0
          test "$(jq '[.Results[]?.Packages[]? | select(.Name == "libstdc++6")] | length' "$report")" -gt 0
          test "$(jq '[.Results[]?.Packages[]? | select(.Name == "libssl3t64")] | length' "$report")" -eq 0
          test "$(jq '[.Results[]?.Packages[]? | select(.Name == "libssl3")] | length' "$report")" -eq 0
          test "$(jq '[.Results[]?.Packages[]? | select(.Name == "deepmerge-ts" and .Version == "7.1.5")] | length' "$report")" -eq 0
          test "$(jq '[.Results[]?.Packages[]? | select(.Name == "effect" and .Version == "3.18.4")] | length' "$report")" -eq 0
      - name: Enforce fresh scanner database and CISA KEV policy
        env:
          IMAGE_NAME: ${{ matrix.image }}
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        shell: bash
        run: |
          set -Eeuo pipefail
          trivy version --format json > "/tmp/${IMAGE_NAME}.trivy-version.json"
          updated="$(jq -er '.VulnerabilityDB.UpdatedAt' "/tmp/${IMAGE_NAME}.trivy-version.json")"
          updated_epoch="$(date --date="$updated" +%s)"
          now_epoch="$(date +%s)"
          age_seconds="$((now_epoch - updated_epoch))"
          test "$age_seconds" -ge -300
          test "$age_seconds" -le 86400

          curl --fail --silent --show-error --location --retry 3 \
            --output /tmp/known_exploited_vulnerabilities.json \
            https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
          jq -e '.vulnerabilities | type == "array"' /tmp/known_exploited_vulnerabilities.json >/dev/null
          jq -r '.vulnerabilities[].cveID' /tmp/known_exploited_vulnerabilities.json | sort -u > /tmp/kev.ids
          jq -r '[.Results[]?.Vulnerabilities[]?.VulnerabilityID] | unique[]' \
            "/tmp/ventureos-${IMAGE_NAME}.trivy.json" | sort -u > /tmp/findings.ids
          comm -12 /tmp/findings.ids /tmp/kev.ids > "/tmp/${IMAGE_NAME}.kev-matches.txt"
          test ! -s "/tmp/${IMAGE_NAME}.kev-matches.txt"
      - name: Gate vulnerabilities, EOL bases, and image secrets
        env:
          IMAGE_NAME: ${{ matrix.image }}
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        shell: bash
        run: |
          set -Eeuo pipefail
          trivy image \
            --input "/tmp/ventureos-${IMAGE_NAME}.tar" \
            --scanners vuln,secret \
            --image-config-scanners secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed=false \
            --exit-on-eol 1 \
            --exit-code 1
      - name: Generate SPDX JSON SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/ventureos-${{ matrix.image }}.tar
          scanners: vuln
          format: spdx-json
          output: /tmp/ventureos-${{ matrix.image }}.spdx.json
          exit-code: '0'
      - name: Preserve scan policy evidence and SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repaired-${{ matrix.image }}-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/ventureos-${{ matrix.image }}.trivy.json
            /tmp/${{ matrix.image }}.trivy-version.json
            /tmp/${{ matrix.image }}.kev-matches.txt
            /tmp/known_exploited_vulnerabilities.json
            /tmp/ventureos-${{ matrix.image }}.spdx.json
          if-no-files-found: warn
          retention-days: 30
