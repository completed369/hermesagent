name: Temporary Stage 6 format helper

'on':
  push:
    branches:
      - feat/stage6-opportunity-evidence-gates
    paths:
      - apps/api/src/modules/opportunities/**
      - apps/api/test/stage6-opportunity-intake.integration.spec.ts
      - packages/database/src/opportunity-scoring.ts
      - packages/policy-engine/src/evidence-quality.ts
      - packages/policy-engine/src/__tests__/evidence-quality.test.ts
      - docs/ADR_0012_STAGE6_EVIDENCE_QUALITY.md
      - .github/workflows/stage6-format-helper.yml

permissions:
  contents: write

jobs:
  format-stage6:
    if: ${{ github.ref == 'refs/heads/feat/stage6-opportunity-evidence-gates' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout isolated Stage 6 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/stage6-opportunity-evidence-gates
          persist-credentials: true
      - name: Enable Corepack
        run: corepack enable
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Format Stage 6 files only
        run: |
          set -Eeuo pipefail
          pnpm exec prettier --write \
            apps/api/src/modules/opportunities/opportunities.controller.ts \
            apps/api/src/modules/opportunities/opportunities.dto.ts \
            apps/api/src/modules/opportunities/opportunities.service.ts \
            apps/api/test/stage6-opportunity-intake.integration.spec.ts \
            packages/database/src/opportunity-scoring.ts \
            packages/database/src/index.ts \
            packages/policy-engine/src/evidence-quality.ts \
            packages/policy-engine/src/__tests__/evidence-quality.test.ts \
            packages/policy-engine/src/index.ts \
            docs/ADR_0012_STAGE6_EVIDENCE_QUALITY.md
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^(apps/api/src/modules/opportunities/|apps/api/test/stage6-opportunity-intake.integration.spec.ts$|packages/database/src/(opportunity-scoring|index).ts$|packages/policy-engine/src/(evidence-quality|index).ts$|packages/policy-engine/src/__tests__/evidence-quality.test.ts$|docs/ADR_0012_STAGE6_EVIDENCE_QUALITY.md$)' || true)"
          test -z "$unexpected" || { printf 'Unexpected changes:\n%s\n' "$unexpected" >&2; exit 1; }
      - name: Commit formatter output
        run: |
          set -Eeuo pipefail
          git add \
            apps/api/src/modules/opportunities/opportunities.controller.ts \
            apps/api/src/modules/opportunities/opportunities.dto.ts \
            apps/api/src/modules/opportunities/opportunities.service.ts \
            apps/api/test/stage6-opportunity-intake.integration.spec.ts \
            packages/database/src/opportunity-scoring.ts \
            packages/database/src/index.ts \
            packages/policy-engine/src/evidence-quality.ts \
            packages/policy-engine/src/__tests__/evidence-quality.test.ts \
            packages/policy-engine/src/index.ts \
            docs/ADR_0012_STAGE6_EVIDENCE_QUALITY.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(stage6): apply repository formatting'
          git push origin HEAD:feat/stage6-opportunity-evidence-gates
