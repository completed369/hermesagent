name: Bootstrap private staging deployment retry

'on':
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: ${{ contains(github.event.head_commit.message, 'BOOTSTRAP-PRIVATE-STAGING-RETRY') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch corrected protected deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RELEASE_SHA: 3f79aaed000bf2bb19ad997ea3e63e5c236a2928
        run: |
          set -Eeuo pipefail
          gh workflow run private-staging-deploy.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f source_sha="${TARGET_RELEASE_SHA}" \
            -f deploy_authorized=true \
            -f authorization_phrase=DEPLOY-PRIVATE-STAGING
          printf 'PROTECTED_DEPLOYMENT_DISPATCHED=%s\n' "${TARGET_RELEASE_SHA}"
