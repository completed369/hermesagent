name: Runtime base candidate scan

'on':
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile.staging'
      - '.github/candidates/**'
      - '.github/workflows/runtime-base-candidate-scan.yml'

permissions:
  contents: read

jobs:
  distroless-debian12:
    name: Scan Distroless Node 22 Debian 12 candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Resolve current linux/amd64 candidate to immutable digest
        id: candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          tag='gcr.io/distroless/nodejs22-debian12:latest-amd64'
          docker pull --platform linux/amd64 "$tag"
          candidate="$(docker image inspect --format '{{index .RepoDigests 0}}' "$tag")"
          [[ "$candidate" =~ ^gcr\.io/distroless/nodejs22-debian12@sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$candidate" | tee /tmp/node22-debian12.candidate.txt
          echo "ref=$candidate" >> "$GITHUB_OUTPUT"
          printf 'CANDIDATE_REF=%s\n' "$candidate"

      - name: Generate complete vulnerability evidence
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.candidate.outputs.ref }}
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          format: json
          output: /tmp/node22-debian12.trivy.json
          exit-code: '0'

      - name: Apply unchanged release-equivalent security gate
        shell: bash
        env:
          CANDIDATE_REF: ${{ steps.candidate.outputs.ref }}
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        run: |
          set -Eeuo pipefail
          trivy image \
            "$CANDIDATE_REF" \
            --scanners vuln,secret \
            --image-config-scanners secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed=false \
            --exit-on-eol 1 \
            --exit-code 1

      - name: Preserve Debian 12 candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-node22-debian12-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/node22-debian12.candidate.txt
            /tmp/node22-debian12.trivy.json
          if-no-files-found: error
          retention-days: 30

  substrate-scan:
    name: Scan Distroless base-nossl Debian 13 substrate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Resolve current linux/amd64 substrate to immutable digest
        id: substrate
        shell: bash
        run: |
          set -Eeuo pipefail
          tag='gcr.io/distroless/base-nossl-debian13:latest-amd64'
          docker pull --platform linux/amd64 "$tag"
          candidate="$(docker image inspect --format '{{index .RepoDigests 0}}' "$tag")"
          [[ "$candidate" =~ ^gcr\.io/distroless/base-nossl-debian13@sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$candidate" | tee /tmp/base-nossl.candidate.txt
          echo "ref=$candidate" >> "$GITHUB_OUTPUT"
          printf 'CANDIDATE_REF=%s\n' "$candidate"

      - name: Generate complete vulnerability evidence
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.substrate.outputs.ref }}
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          format: json
          output: /tmp/base-nossl.trivy.json
          exit-code: '0'

      - name: Apply release-equivalent vulnerability, secret, and EOL gate
        shell: bash
        env:
          CANDIDATE_REF: ${{ steps.substrate.outputs.ref }}
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        run: |
          set -Eeuo pipefail
          trivy image \
            "$CANDIDATE_REF" \
            --scanners vuln,secret \
            --image-config-scanners secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed=false \
            --exit-on-eol 1 \
            --exit-code 1

      - name: Preserve substrate digest and scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-base-nossl-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/base-nossl.candidate.txt
            /tmp/base-nossl.trivy.json
          if-no-files-found: error
          retention-days: 30

  node-closure:
    name: Inspect official Node 22 dynamic runtime closure
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Resolve official Node 22 trixie source image
        shell: bash
        run: |
          set -Eeuo pipefail
          tag='node:22-trixie-slim'
          docker pull --platform linux/amd64 "$tag"
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$tag")"
          [[ "$digest" =~ ^(node|docker\.io/library/node)@sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$digest" | tee /tmp/node-source.candidate.txt

      - name: Record Node/OpenSSL versions and dynamic dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --platform linux/amd64 --entrypoint sh node:22-trixie-slim -c '
            set -eu
            node --version
            node -p "process.versions.openssl"
            ldd /usr/local/bin/node
          ' | tee /tmp/node-runtime-closure.txt
          ! grep -Eq 'libssl\.so|libcrypto\.so' /tmp/node-runtime-closure.txt

      - name: Preserve Node closure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-runtime-closure-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/node-source.candidate.txt
            /tmp/node-runtime-closure.txt
          if-no-files-found: error
          retention-days: 30

  composed-runtime:
    name: Build and gate partly-static Node on base-nossl
    needs: [substrate-scan, node-closure]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build evidence-only runtime candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build \
            --file .github/candidates/Dockerfile.node22-partly-static \
            --tag "local/ventureos-node-runtime:${GITHUB_SHA}" \
            --progress plain \
            .

      - name: Verify runtime, embedded OpenSSL, crypto, and ELF closure
        shell: bash
        run: |
          set -Eeuo pipefail
          image="local/ventureos-node-runtime:${GITHUB_SHA}"
          test "$(docker run --rm "$image" --version)" = 'v22.23.2'
          test "$(docker run --rm "$image" -p 'process.versions.openssl')" = '3.5.7'
          test "$(docker run --rm "$image" -e "process.stdout.write(require('crypto').createHash('sha256').update('ventureos').digest('hex'))")" = '0d5373daa1fcbf607472fb04bd6d3b5f3a62565a3944a09ebce10bb17534d495'

          cid="$(docker create "$image")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/nodejs/bin/node" /tmp/node-partly-static
          readelf -d /tmp/node-partly-static | tee /tmp/node-partly-static.readelf.txt
          ! grep -Eq 'libssl\.so|libcrypto\.so|libstdc\+\+\.so|libgcc_s\.so' /tmp/node-partly-static.readelf.txt
          grep -q 'libc\.so\.6' /tmp/node-partly-static.readelf.txt

      - name: Generate complete candidate vulnerability evidence
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/ventureos-node-runtime:${{ github.sha }}
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          format: json
          output: /tmp/node-partly-static.trivy.json
          exit-code: '0'

      - name: Apply unchanged release-equivalent security gate
        shell: bash
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        run: |
          set -Eeuo pipefail
          trivy image \
            "local/ventureos-node-runtime:${GITHUB_SHA}" \
            --scanners vuln,secret \
            --image-config-scanners secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed=false \
            --exit-on-eol 1 \
            --exit-code 1

      - name: Preserve composed runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-partly-static-runtime-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/node-partly-static.readelf.txt
            /tmp/node-partly-static.trivy.json
          if-no-files-found: error
          retention-days: 30
